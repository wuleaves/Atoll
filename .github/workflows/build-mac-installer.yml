name: Build Mac Installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Prepare toolchain
        run: |
          sudo xcodebuild -runFirstLaunch
          if ! xcrun -f metal >/dev/null 2>&1; then
            sudo xcodebuild -downloadComponent MetalToolchain
          fi

      - name: Prepare local signing
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          path = Path('DynamicIsland/DynamicIsland.entitlements')
          entitlements = plistlib.loads(path.read_bytes())
          entitlements.pop('com.apple.security.mach-services', None)
          path.write_bytes(plistlib.dumps(entitlements))
          PY

      - name: Build universal app
        run: |
          set -o pipefail
          xcodebuild build \
            -project DynamicIsland.xcodeproj \
            -scheme DynamicIsland \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/BuildResults.xcresult \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY='-' CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM='' 'DEVELOPMENT_TEAM[sdk=macosx*]=' \
            'CODE_SIGN_IDENTITY[sdk=macosx*]=-' \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            PROVISIONING_PROFILE_SPECIFIER='' \
            2>&1 | tee build.log

      - name: Verify and package DMG
        run: |
          set -euo pipefail
          APP='build/DerivedData/Build/Products/Release/Atoll.app'
          test -x "$APP/Contents/MacOS/Atoll"
          lipo -verify_arch arm64 x86_64 "$APP/Contents/MacOS/Atoll"
          codesign --verify --deep --strict "$APP"
          mkdir -p build/dmg-root installers
          ditto "$APP" build/dmg-root/Atoll.app
          ln -s /Applications build/dmg-root/Applications
          VERSION=$(tr -d '[:space:]' < VERSION)
          DMG="installers/Atoll-${VERSION}-universal.dmg"
          hdiutil create -volname Atoll -srcfolder build/dmg-root \
            -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          shasum -a 256 "$DMG" > "$DMG.sha256"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-Mac-Installer
          path: installers/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Atoll-Build-Diagnostics
          path: |
            build.log
            build/BuildResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
